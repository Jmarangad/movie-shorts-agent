services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: movie-shorts-agent:latest
    container_name: movie-shorts-agent
    env_file:
      - .env
    environment:
      - OUTPUT_DIR=/app/output
      - DOWNLOADS_DIR=/app/downloads
    volumes:
      - ./output:/app/output
      - ./downloads:/app/downloads
    # Run the agent as a 3-hour scheduler. Override for a one-off run with:
    #   docker compose run --rm agent --query "…"
    command: ["--schedule"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The pipeline needs network to reach YouTube/edge-tts/Gemini.
    network_mode: host
    # yt-dlp + ffmpeg may touch the OS temp dir; give it a bounded tmpfs.
    tmpfs:
      - /tmp:size=512m